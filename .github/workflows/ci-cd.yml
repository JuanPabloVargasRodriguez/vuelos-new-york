name: CI CD vuelos NYC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI - probar, validar y generar
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas unitarias
        run: python -m pytest tests/ -v
      - name: Validar ambos CSV completos
        run: python -m scripts.validar_datos
      - name: Crear portada e informe de Evidently
        run: python -m scripts.generar_informe
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

  deploy:
    name: CD - publicar ultima version valida
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
